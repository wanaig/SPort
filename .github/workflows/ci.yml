name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile app.py
          python -m py_compile tray.py
          python -m py_compile platforms/__init__.py
          python -m py_compile platforms/_common.py
          python -m py_compile platforms/windows.py
          python -m py_compile platforms/darwin.py
          python -m py_compile platforms/linux.py

      - name: Smoke test
        run: |
          python -c "
          from app import app, scan_ports, _is_system_process, _system_registry
          SYSTEM_PROCESSES = _system_registry.processes
          SYSTEM_USERS = _system_registry.users

          s = scan_ports()
          items = s['items']
          sys_items = [r for r in items if r['is_system']]
          assert s['summary']['hidden'] == len(sys_items), 'summary.hidden mismatch'
          assert len(SYSTEM_PROCESSES) >= 40, 'SYSTEM_PROCESSES should have 40+ entries'
          assert len(SYSTEM_USERS) >= 4, 'SYSTEM_USERS should have 4+ entries'

          with app.test_client() as c:
              r = c.get('/api/ports')
              assert r.status_code == 200, f'/api/ports returned {r.status_code}'
              assert r.get_json()['summary']['total'] >= 0

              r = c.get('/api/system-processes')
              assert r.status_code == 200
              j = r.get_json()
              assert 'builtin' in j and 'users' in j
              assert len(j['builtin']) >= 40

          print(f'OK: {s[\"summary\"][\"total\"]} ports, {len(sys_items)} system, {len(SYSTEM_PROCESSES)} known system procs')
          "

  build:
    name: Build Windows installer
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build SPort.exe
        run: pyinstaller build.spec

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Install Chinese language file
        shell: pwsh
        run: |
          $islPath = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          if (-not (Test-Path $islPath)) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/refs/heads/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile $islPath -UseBasicParsing
          }

      - name: Build installer
        shell: cmd
        env:
          INNO_SETUP: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          CI: 'true'
        run: build.bat

      - name: Verify artifacts
        shell: pwsh
        run: |
          $exe = "dist\SPort.exe"
          $setup = "dist\SPort-Setup-0.3.0.exe"
          if (-not (Test-Path $exe)) { throw "$exe not found" }
          if (-not (Test-Path $setup)) { throw "$setup not found" }
          $setupSize = [math]::Round((Get-Item $setup).Length / 1MB, 2)
          Write-Host "SPort.exe:        $exeSize MB"
          Write-Host "Installer:        $setupSize MB"
          if ($setupSize -lt 10) { throw "Installer suspiciously small ($setupSize MB)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sport-setup
          path: dist/SPort-Setup-0.3.0.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build SPort.app
        run: pyinstaller build.spec

      - name: Create DMG
        run: |
          mkdir -p dmg-contents
          cp -r dist/SPort.app dmg-contents/
          ln -s /Applications dmg-contents/Applications
          hdiutil create -volname "SPort" -srcfolder dmg-contents -ov -format UDZO dist/SPort-macOS.dmg

      - name: Verify artifacts
        run: |
          ls -lh dist/SPort-macOS.dmg
          test -f dist/SPort-macOS.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: sport-macos
          path: dist/SPort-macOS.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y libnotify-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build SPort
        run: pyinstaller build.spec

      - name: Package as tarball
        run: |
          chmod +x dist/SPort
          tar czf dist/SPort-Linux-x86_64.tar.gz -C dist SPort

      - name: Verify artifacts
        run: |
          ls -lh dist/SPort-Linux-x86_64.tar.gz
          test -f dist/SPort-Linux-x86_64.tar.gz

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: sport-linux
          path: dist/SPort-Linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: windows-latest
    needs: [build, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: sport-setup
          path: dist

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: sport-macos
          path: dist

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: sport-linux
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: SPort ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/SPort-Setup-0.3.0.exe
            dist/SPort-macOS.dmg
            dist/SPort-Linux-x86_64.tar.gz
